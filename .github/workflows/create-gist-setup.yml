name: Create aggregator Gist
on: workflow_dispatch
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create private Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_PAT }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'GIST_PAT is missing'; exit 1; }
          printf '%s' '{"description":"Aggregator subscription output","public":false,"files":{"README.txt":{"content":"Aggregator subscription output"}}}' > /tmp/gist.json
          gh api --method POST /gists --input /tmp/gist.json --jq '"GIST_LINK=" + .owner.login + "/" + .id'
